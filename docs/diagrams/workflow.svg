<svg width="680" height="406" viewBox="0 0 680 406" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Motion Taggerの処理フロー</title>
<desc>Figma上でレイヤーを選択し、Motion Taggerプラグインで部品IDとアニメーションを設定すると、Figma Motionへの自動プレビューとJSONエクスポートの2つの出力に分岐する流れを示す図</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.line { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>

<g>
<rect x="220" y="20" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#444441">Figmaでレイヤーを選択</text>
</g>

<line x1="340" y1="64" x2="340" y2="100" class="line" marker-end="url(#arrow)"/>

<g>
<rect x="210" y="100" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="118" text-anchor="middle" dominant-baseline="central" fill="#085041">Motion Tagger</text>
<text class="ts" x="340" y="138" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">部品ID・アニメを設定</text>
</g>

<path d="M340,156 L340,180 L240,180 L240,218" class="line" marker-end="url(#arrow)"/>
<path d="M340,156 L340,180 L540,180 L540,218" class="line" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="220" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="240" y="238" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Figma Motion (Beta)</text>
<text class="ts" x="240" y="256" text-anchor="middle" dominant-baseline="central" fill="#534AB7">自動でプレビュー</text>
</g>

<g>
<rect x="440" y="220" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="540" y="238" text-anchor="middle" dominant-baseline="central" fill="#712B13">JSONプレビュー</text>
<text class="ts" x="540" y="256" text-anchor="middle" dominant-baseline="central" fill="#993C1D">全アニメ一覧タブ</text>
</g>

<line x1="540" y1="276" x2="540" y2="310" class="line" marker-end="url(#arrow)"/>

<g>
<rect x="440" y="310" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="540" y="328" text-anchor="middle" dominant-baseline="central" fill="#712B13">JSONファイル</text>
<text class="ts" x="540" y="346" text-anchor="middle" dominant-baseline="central" fill="#993C1D">エクスポート</text>
</g>
</svg>
