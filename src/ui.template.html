<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Motion Tagger</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1e1e1e;
    --muted: #8c8c8c;
    --border: #e6e6e6;
    --accent: #18a0fb;
    --accent-fg: #ffffff;
    --danger: #f24822;
    --warning: #b8860b;
    --warning-bg: #fdf3d9;
    --panel: #f7f7f7;
    --tab-active: #18a0fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2c2c2c;
      --fg: #ffffff;
      --muted: #a5a5a5;
      --border: #444444;
      --panel: #383838;
      --warning: #e8b339;
      --warning-bg: #4a3c17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    font-size: 12px;
    color: var(--fg);
    background: var(--bg);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 6px 8px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    cursor: pointer;
    font-size: 11px;
  }
  .tab-btn.active {
    background: var(--tab-active);
    border-color: var(--tab-active);
    color: var(--accent-fg);
  }
  main { flex: 1; overflow-y: auto; padding: 12px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-size: 12px;
  }
  .row { display: flex; gap: 8px; }
  .row > .field { flex: 1; }
  .from-to { display: flex; align-items: center; gap: 6px; }
  .from-to input { flex: 1; min-width: 0; }
  .from-to-arrow { color: var(--muted); font-size: 13px; flex-shrink: 0; }
  .from-to-sublabels {
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
    margin-top: 3px;
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }
  button.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  button.danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 11px;
  }
  button.icon-btn {
    padding: 2px 7px;
    font-size: 13px;
    line-height: 1.6;
    border-radius: 5px;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .panel {
    background: var(--panel);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .panel h3 {
    margin: 0 0 8px 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .subsection {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .subsection-title {
    margin: 0 0 8px 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .editing-note {
    color: var(--accent);
    font-size: 10px;
    margin-bottom: 8px;
  }
  .empty {
    color: var(--muted);
    font-style: italic;
    padding: 12px 4px;
    text-align: center;
  }
  .anim-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 11px;
  }
  .anim-item-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .anim-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 10px;
    margin-right: 6px;
  }
  .anim-id-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    margin-right: 6px;
  }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  #json-preview {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--fg);
  }
  #error-banner {
    display: none;
    background: #fdecea;
    color: var(--danger);
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 11px;
  }
  #duplicate-warning {
    display: none;
    background: var(--warning-bg);
    color: var(--warning);
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 11px;
    line-height: 1.5;
  }
  #offset-fields { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="tab-btn active" data-tab="selected">選択中</button>
    <button class="tab-btn" data-tab="all">全アニメ一覧</button>
  </header>
  <main>
    <div id="error-banner"></div>

    <section id="tab-selected" class="tab-panel active">
      <div id="no-selection" class="empty">Figma上でレイヤーを選択してください</div>

      <div id="selected-content" style="display:none">
        <div class="panel">
          <h3>レイヤー</h3>
          <div class="field">
            <label>Figmaレイヤー名</label>
            <input type="text" id="layer-name" disabled />
          </div>
          <div class="field">
            <label>部品ID(任意・空欄可)</label>
            <input type="text" id="tag-id-input" placeholder="例: hero_title(空欄でも可)" />
          </div>
          <div class="actions">
            <button class="primary" id="save-tag-btn">部品IDを追加</button>
            <button class="danger" id="delete-tag-btn" style="display:none">アニメ削除</button>
          </div>
        </div>

        <div class="panel" id="animations-panel">
          <h3>アニメーション</h3>

          <div class="subsection">
            <h4 class="subsection-title">設定済みアニメーション</h4>
            <div id="anim-list"></div>
          </div>

          <div class="subsection">
            <h4 class="subsection-title" id="anim-form-title">アニメーションを追加</h4>
            <div class="editing-note" id="editing-note" style="display:none"></div>
            <div class="field">
              <label>種類</label>
              <select id="anim-type">
                <option value="fadeIn">フェードイン</option>
                <option value="fadeOut">フェードアウト</option>
                <option value="move">ムーブ</option>
                <option value="resize">サイズ変更</option>
              </select>
            </div>
            <div class="field">
              <label>アニメID(任意・重複可)</label>
              <input type="text" id="anim-id-input" placeholder="例: fade_standard" />
            </div>
            <div class="row">
              <div class="field">
                <label>Duration (ms)</label>
                <input type="number" id="anim-duration" value="300" min="0" step="10" />
              </div>
              <div class="field">
                <label>Delay (ms)</label>
                <input type="number" id="anim-delay" value="0" min="0" step="10" />
              </div>
            </div>
            <div class="field">
              <label>Easing</label>
              <select id="anim-easing">
                <option value="linear">linear</option>
                <option value="easeIn">easeIn</option>
                <option value="easeOut" selected>easeOut</option>
                <option value="easeInOut">easeInOut</option>
                <option value="easeInCubic">easeInCubic</option>
                <option value="easeOutCubic">easeOutCubic</option>
                <option value="easeInOutCubic">easeInOutCubic</option>
                <option value="easeInQuad">easeInQuad</option>
                <option value="easeOutQuad">easeOutQuad</option>
                <option value="easeInOutQuad">easeInOutQuad</option>
                <option value="custom">カスタム (cubic-bezier)</option>
              </select>
            </div>
            <div class="field" id="custom-easing-field" style="display:none">
              <label>cubic-bezier(x1,y1,x2,y2)</label>
              <input type="text" id="anim-easing-custom" placeholder="cubic-bezier(0.4,0,0.2,1)" />
            </div>
            <div id="move-fields" style="display:none">
              <div class="field">
                <label>指定方法</label>
                <select id="move-mode">
                  <option value="absolute" selected>絶対座標</option>
                  <option value="delta">差分 (dx/dy)</option>
                </select>
              </div>
              <div id="move-absolute-row">
                <div class="field">
                  <label>X (px)</label>
                  <div class="from-to">
                    <input type="number" id="move-from-x" step="1" />
                    <span class="from-to-arrow" aria-hidden="true">→</span>
                    <input type="number" id="move-to-x" step="1" />
                  </div>
                  <div class="from-to-sublabels"><span>from</span><span>to</span></div>
                </div>
                <div class="field">
                  <label>Y (px)</label>
                  <div class="from-to">
                    <input type="number" id="move-from-y" step="1" />
                    <span class="from-to-arrow" aria-hidden="true">→</span>
                    <input type="number" id="move-to-y" step="1" />
                  </div>
                  <div class="from-to-sublabels"><span>from</span><span>to</span></div>
                </div>
              </div>
              <div class="row" id="move-delta-row" style="display:none">
                <div class="field">
                  <label>移動元 dx (px)</label>
                  <input type="number" id="anim-dx" value="-100" step="1" />
                </div>
                <div class="field">
                  <label>移動元 dy (px)</label>
                  <input type="number" id="anim-dy" value="0" step="1" />
                </div>
              </div>
            </div>
            <div id="resize-fields" style="display:none">
              <div class="field">
                <label>指定方法</label>
                <select id="resize-mode">
                  <option value="percentage" selected>パーセンテージ</option>
                  <option value="absolute">幅・高さ (from-to)</option>
                </select>
              </div>
              <div class="row" id="resize-percentage-row">
                <div class="field">
                  <label>X方向 (%)</label>
                  <input type="number" id="resize-scale-x" value="80" step="1" />
                </div>
                <div class="field">
                  <label>Y方向 (%)</label>
                  <input type="number" id="resize-scale-y" value="80" step="1" />
                </div>
              </div>
              <div id="resize-absolute-row" style="display:none">
                <div class="field">
                  <label>幅 (px)</label>
                  <div class="from-to">
                    <input type="number" id="resize-from-width" step="1" />
                    <span class="from-to-arrow" aria-hidden="true">→</span>
                    <input type="number" id="resize-to-width" step="1" />
                  </div>
                  <div class="from-to-sublabels"><span>from</span><span>to</span></div>
                </div>
                <div class="field">
                  <label>高さ (px)</label>
                  <div class="from-to">
                    <input type="number" id="resize-from-height" step="1" />
                    <span class="from-to-arrow" aria-hidden="true">→</span>
                    <input type="number" id="resize-to-height" step="1" />
                  </div>
                  <div class="from-to-sublabels"><span>from</span><span>to</span></div>
                </div>
              </div>
            </div>
            <div class="actions">
              <button class="secondary" id="add-anim-btn">+ アニメーションを追加</button>
              <button class="danger" id="cancel-edit-btn" style="display:none">キャンセル</button>
            </div>
          </div>

          <div class="sub" style="color:var(--muted);font-size:10px;line-height:1.5">
            追加・削除すると、このフレーム内のアニメ設定済み要素すべての内容がFigma Motion(Beta)のキーフレームへ自動的に反映されます。画面下部のMotionタイムラインパネルで再生できます。
          </div>
        </div>
      </div>
    </section>

    <section id="tab-all" class="tab-panel">
      <div id="duplicate-warning"></div>
      <div id="all-empty" class="empty">まだアニメが設定された要素がありません</div>
      <pre id="json-preview" style="display:none"></pre>
      <button class="primary" id="export-btn" style="width:100%;margin-top:12px">JSONをエクスポート</button>
    </section>
  </main>
</div>
<script>
/*__UI_SCRIPT__*/
</script>
</body>
</html>
